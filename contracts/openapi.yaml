openapi: 3.1.0
info:
  title: Инспектор ИИ
  version: 0.1.0-skeleton
  description: >
    Сверка ПД/РД/ИД по матрице 132 параметров. Асинхронная pull-модель:
    загрузка возвращает process_id, результат забирается по запросу.
    CONFIRMED_VIOLATION присваивает только инспектор.
    Имя продукта в интерфейсе — «Инспектор ИИ» (ТЗ п. 1.1).
    Кодовая линия репозитория — Контур.
servers:
  - url: /api/v1

# ТЗ п. 12: доступ только по токену. Роли операций перечислены в
# x-required-roles и продублированы в backend/src/kontur/presentation/rbac.py;
# расхождение ловит scripts/check_contracts.py.
security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      summary: Жив ли процесс ядра
      operationId: healthz
      security: []
      responses:
        "200":
          description: Процесс отвечает

  /system/capabilities:
    get:
      summary: Честный снимок слоёв извлечения
      description: >
        overall — живой путь (сейчас векторный текст). Отсутствующие OCR,
        таблицы и разбор чертежа перечислены явно: тишина не считается успехом.
        LLM/VLM — advisory и не валят комплект.
      operationId: getSystemCapabilities
      x-required-roles: [INSPECTOR, SUPERVISOR, ADMIN]
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          description: Снимок возможностей
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemCapabilities" }

  /documents/upload:
    post:
      summary: Загрузка пакета документов (инкрементальная дозагрузка до финализации)
      operationId: uploadDocuments
      x-required-roles: [INSPECTOR, SUPERVISOR]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [object_id, files]
              properties:
                object_id: { type: string }
                process_id:
                  type: string
                  description: Указывается при дозагрузке в существующий процесс
                doc_stage:
                  type: string
                  enum: [PD, RD, ID]
                files:
                  type: array
                  # OAS 3.1 / JSON Schema 2020-12: contentMediaType вместо format:binary
                  items: { type: string, contentMediaType: application/octet-stream }
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "202":
          description: Принято в обработку
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadAccepted" }
        "400": { $ref: "#/components/responses/Rejected" }
        "409":
          description: Протокол финализирован, дозагрузка запрещена
        "413":
          description: Превышен лимит файла (50 МБ) или пакета (200 МБ)
        "415":
          description: Неподдерживаемый формат файла (перечень — application.intake)

  /processes/{process_id}/status:
    get:
      summary: Статус обработки (целевой p95 ≤200 мс)
      operationId: getProcessStatus
      x-required-roles: [INSPECTOR, SUPERVISOR, ADMIN]
      parameters: [{ $ref: "#/components/parameters/ProcessId" }]
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProcessStatus" }
        "404": { description: Процесс не найден }

  /processes/{process_id}/protocol:
    get:
      summary: Протокол проверки (структура по Приложению 2 ТЗ)
      operationId: getProtocol
      x-required-roles: [INSPECTOR, SUPERVISOR, ADMIN]
      parameters:
        - { $ref: "#/components/parameters/ProcessId" }
        - name: version
          in: query
          schema: { type: integer }
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          content:
            application/json:
              schema: { $ref: "./schemas/protocol.schema.json" }
        "404": { description: Процесс не найден или протокол ещё не собран }

  /processes/{process_id}/audit:
    get:
      summary: Журнал действий текущего процесса
      description: >
        События MemoryAudit этого процесса (REVIEW, FINALIZE, UNFINALIZE).
        Это не таблица user_action_log: после рестарта журнал пуст (GAP-EDIT).
      operationId: getAuditLog
      x-required-roles: [INSPECTOR, SUPERVISOR, ADMIN]
      parameters: [{ $ref: "#/components/parameters/ProcessId" }]
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditLog" }
        "404": { description: Процесс не найден }

  /findings/{finding_id}/review:
    post:
      summary: Решение инспектора по атомарной находке
      operationId: reviewFinding
      x-required-roles: [INSPECTOR, SUPERVISOR]
      parameters:
        - name: finding_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewDecision" }
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          content:
            application/json:
              schema: { $ref: "./schemas/finding.schema.json" }
        "409": { description: Недопустимый переход состояния }
        "422": { description: Отсутствует reason_code при отклонении }

  /processes/{process_id}/finalize:
    post:
      summary: Финализация протокола
      description: >
        Разрешена только человеку и только после обработки всех CANDIDATE и
        SUSPICION. CLARIFICATION_REQUIRED — допустимый способ закрыть кандидата
        (п. 9.3). MISSING_EVIDENCE выводится отдельным перечнем.
      operationId: finalizeProtocol
      x-required-roles: [INSPECTOR, SUPERVISOR]
      parameters: [{ $ref: "#/components/parameters/ProcessId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inspector_id]
              properties:
                inspector_id: { type: string }
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProcessStatus" }
        "409": { description: Есть необработанные кандидаты или вызывающий не инспектор }

  /processes/{process_id}/unfinalize:
    post:
      summary: Отмена финализации супервизором
      description: >
        Только из PROTOCOL_FINALIZED / FINALIZED, только супервизор, только с
        причиной. Результат — COMPLETED, новая версия протокола и запись аудита
        (ADR-0005).
      operationId: unfinalizeProtocol
      x-required-roles: [SUPERVISOR]
      parameters: [{ $ref: "#/components/parameters/ProcessId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inspector_id, reason]
              properties:
                inspector_id: { type: string }
                reason: { type: string, minLength: 1 }
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProcessStatus" }
        "409": { description: Не FINALIZED или вызывающий не супервизор }

  /inspection/{process_id}:
    post:
      summary: Передача результатов во внешнюю ИС (целевая — ИАИС «РиН»)
      description: >
        Разрешена только при PROTOCOL_FINALIZED. Передаются только
        подтверждённые инспектором записи с версиями протокола, матрицы,
        модели и реестром входных файлов. До 3 повторов: 1, 5, 15 минут.
      operationId: syncInspection
      x-required-roles: [SUPERVISOR, ADMIN]
      parameters: [{ $ref: "#/components/parameters/ProcessId" }]
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "202":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncState" }
        "409": { description: Протокол не финализирован }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Токен доступа с ролями INSPECTOR / SUPERVISOR / ADMIN (ТЗ п. 12).
        Администратор не подтверждает нарушения и не финализирует протокол
        (ADR-0001), отмена финализации — только супервизор (п. 9.3).

  parameters:
    ProcessId:
      name: process_id
      in: path
      required: true
      schema: { type: string }

  responses:
    Unauthorized:
      description: Токен отсутствует или недействителен (ТЗ п. 12)
    Forbidden:
      description: Роль субъекта не допускает операцию (ТЗ п. 12)
    Rejected:
      description: Файл или пакет отклонён
      content:
        application/json:
          schema: { $ref: "#/components/schemas/RejectionReason" }

  schemas:
    UploadAccepted:
      type: object
      required: [process_id, accepted, rejected]
      properties:
        process_id: { type: string }
        accepted:
          type: array
          items:
            type: object
            required: [file_id, file_hash]
            properties:
              file_id: { type: string }
              file_hash: { type: string, pattern: "^[a-f0-9]{64}$" }
        rejected:
          type: array
          items: { $ref: "#/components/schemas/RejectionReason" }

    RejectionReason:
      type: object
      required: [reason_code, message]
      properties:
        file_name: { type: string }
        reason_code:
          type: string
          enum:
            - UNSUPPORTED_FORMAT
            - CORRUPTED_FILE
            - FILE_TOO_LARGE
            - BATCH_LIMIT_EXCEEDED
            - ANTIVIRUS_REJECTED
            - ENCRYPTED_FILE
            - PROCESSING_TIMEOUT
            - UNSAFE_FILENAME
        message: { type: string }

    ProcessStatus:
      type: object
      required: [process_id, process_state, completeness, sync_state, versions]
      properties:
        process_id: { type: string }
        process_state:
          type: string
          enum: [PENDING, PARSING, READY, VERIFYING, COMPLETED, FINALIZED]
        scenario:
          type: string
          enum: [FULL, PD_RD_ONLY, PD_ID_ONLY, RD_ID_ONLY, SINGLE_ONLY, PARTIALLY_LOADED]
        completeness:
          type: object
          required: [pd, rd, id]
          description: >
            Буквальные статусы п. 9.1. Внутри домена хранится UPLOADED/PARTIAL/MISSING
            и проецируется через tz_upload_status.
          properties:
            pd:
              type: string
              enum: [PD_UPLOADED, PD_PARTIAL, PD_MISSING]
            rd:
              type: string
              enum: [RD_UPLOADED, RD_PARTIAL, RD_MISSING]
            id:
              type: string
              enum: [ID_UPLOADED, ID_PARTIAL, ID_MISSING]
        protocol_status:
          type: string
          description: Проекция п. 9.3. COMPLETED→VERIFICATION_COMPLETED, FINALIZED→PROTOCOL_FINALIZED.
          enum: [READY, VERIFYING, VERIFICATION_COMPLETED, PROTOCOL_FINALIZED]
        counters:
          type: object
          description: candidates и confirmed считаются раздельно; в число нарушений входит только confirmed
          properties:
            candidates: { type: integer }
            confirmed_violations: { type: integer }
            negative_verified: { type: integer }
            missing_evidence: { type: integer }
            clarification_required: { type: integer }
            suspicions: { type: integer }
        sync_state: { $ref: "#/components/schemas/SyncState" }
        versions: { $ref: "#/components/schemas/Versions" }

    SyncState:
      type: string
      enum: [NOT_REQUESTED, PENDING_SYNC, SYNCING, SYNCED, RETRY_WAIT, FAILED_TERMINAL]

    Versions:
      type: object
      required: [matrix_version, model_version, dataset_version, input_manifest_hash, git_sha]
      properties:
        matrix_version: { type: string }
        model_version: { type: string }
        dataset_version: { type: string }
        input_manifest_hash: { type: string }
        git_sha: { type: string }

    SystemCapabilities:
      type: object
      required: [overall, kit_blocked, engines, health]
      properties:
        overall:
          type: string
          enum: [AVAILABLE, DEGRADED, UNAVAILABLE]
          description: Статус живого пути извлечения, не «все слои зелёные».
        kit_blocked: { type: boolean }
        note: { type: string }
        engines:
          type: array
          items:
            type: object
            required: [name, status, affects_verdict]
            properties:
              name: { type: string }
              status:
                type: string
                enum: [AVAILABLE, DEGRADED, UNAVAILABLE]
              affects_verdict: { type: boolean }
        health:
          type: object
          required: [healthy, degraded, failed, skipped]
          properties:
            healthy:
              type: array
              items: { type: string }
            degraded:
              type: array
              items: { type: string }
            failed:
              type: array
              items: { type: string }
            skipped:
              type: array
              items: { type: string }

    AuditLog:
      type: object
      required: [process_id, events]
      properties:
        process_id: { type: string }
        events:
          type: array
          items:
            type: object
            required: [actor_id, action, payload]
            properties:
              actor_id: { type: string }
              action: { type: string }
              payload: { type: object, additionalProperties: true }

    ReviewDecision:
      type: object
      required: [action, inspector_id, comment]
      properties:
        action:
          type: string
          enum: [CONFIRM, REJECT, REQUEST_CLARIFICATION]
          description: >
            SPLIT составного кандидата — отдельная операция (ещё не реализована).
            Не смешивается с атомарным решением.
        inspector_id: { type: string }
        reason_code:
          type: string
          description: Обязателен при REJECT
          enum:
            - WRONG_REVISION_SELECTED
            - APPROVED_CHANGE_EXISTS
            - OCR_ERROR
            - LINKAGE_ERROR
            - PARAMETER_NOT_APPLICABLE
            - SOURCE_QUALITY
            - OTHER
        comment:
          type: string
          minLength: 1
          description: Обязателен при CONFIRM, REJECT и REQUEST_CLARIFICATION (ТЗ п. 9.3)
