<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kontur Gate K — Protocol Viewer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    /* ---------- header ---------- */
    header {
      background: #1a1d2e;
      border-bottom: 1px solid #2d3748;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    header h1 { font-size: 15px; font-weight: 600; color: #7c83f7; }
    .badge {
      font-size: 11px; padding: 2px 8px;
      border-radius: 9px;
      background: #2d3748; color: #a0aec0;
    }
    .badge.passed  { background: #1a3a2a; color: #48bb78; }
    .badge.failed  { background: #3a1a1a; color: #fc8181; }
    .pdf-upload {
      margin-left: auto;
      display: flex; align-items: center; gap: 8px;
    }
    .pdf-upload label {
      cursor: pointer; font-size: 12px; color: #7c83f7;
      border: 1px solid #4a5568; border-radius: 6px;
      padding: 4px 10px;
    }
    .pdf-upload label:hover { background: #2d3748; }
    /* ---------- main ---------- */
    main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    /* ---------- LEFT: PDF panel 60% ---------- */
    .pdf-panel {
      width: 60%;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #2d3748;
      position: relative;
      overflow: hidden;
      background: #181b2e;
    }
    .pdf-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: #1a1d2e;
      border-bottom: 1px solid #2d3748;
      font-size: 12px;
      flex-shrink: 0;
    }
    .pdf-toolbar button {
      padding: 3px 10px;
      border: 1px solid #4a5568;
      border-radius: 5px;
      background: #2d3748;
      color: #e2e8f0;
      cursor: pointer;
      font-size: 12px;
    }
    .pdf-toolbar button:hover { background: #3d4a5e; }
    #pageInfo { color: #a0aec0; min-width: 80px; text-align: center; }
    .canvas-wrap {
      flex: 1;
      overflow: auto;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 16px;
      position: relative;
    }
    #pdfCanvas {
      display: block;
      box-shadow: 0 4px 24px rgba(0,0,0,0.5);
      background: white;
    }
    /* SVG overlay for BoundingBox */
    #bboxSvg {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
    }
    /* ---------- RIGHT: Evidence Cards 40% ---------- */
    .cards-panel {
      width: 40%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .cards-header {
      padding: 12px 16px 8px;
      background: #1a1d2e;
      border-bottom: 1px solid #2d3748;
      flex-shrink: 0;
    }
    .cards-header h2 { font-size: 13px; font-weight: 600; color: #a0aec0; }
    .filter-row {
      display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap;
    }
    .filter-btn {
      font-size: 11px; padding: 2px 8px;
      border: 1px solid #4a5568;
      border-radius: 9px;
      background: transparent;
      color: #a0aec0;
      cursor: pointer;
    }
    .filter-btn.active {
      color: #fff;
      border-color: currentColor;
    }
    .filter-btn[data-sev="BLOCKER"].active  { color: #fc8181; }
    .filter-btn[data-sev="CRITICAL"].active { color: #ffa07a; }
    .filter-btn[data-sev="MAJOR"].active    { color: #f6e05e; }
    .filter-btn[data-sev="MINOR"].active    { color: #68d391; }
    .filter-btn[data-sev="ALL"].active      { color: #7c83f7; }
    .cards-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    /* ---------- Evidence Card ---------- */
    .card {
      background: #1e2235;
      border-radius: 8px;
      border: 1px solid #2d3748;
      padding: 10px 12px;
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .card:hover  { border-color: #4a5568; background: #232740; }
    .card.active { border-color: #7c83f7; background: #242850; }
    .card-top {
      display: flex; align-items: center; gap: 8px; margin-bottom: 5px;
    }
    .rule-code { font-size: 12px; font-weight: 700; color: #7c83f7; }
    .sev-badge {
      font-size: 10px; padding: 1px 6px; border-radius: 6px;
      font-weight: 600;
    }
    .sev-BLOCKER  { background: #4a1919; color: #fc8181; }
    .sev-CRITICAL { background: #3a2010; color: #ffa07a; }
    .sev-MAJOR    { background: #3a3010; color: #f6e05e; }
    .sev-MINOR    { background: #1a3020; color: #68d391; }
    .sev-INFO     { background: #1a2030; color: #63b3ed; }
    .status-badge {
      font-size: 10px; padding: 1px 6px; border-radius: 6px; margin-left: auto;
    }
    .status-CONFIRMED_VIOLATION { background: #4a1919; color: #fc8181; }
    .status-ABSTAINED           { background: #2a2a1a; color: #d4a017; }
    .status-COMPLIANT           { background: #1a3020; color: #68d391; }
    .card-desc {
      font-size: 11px; color: #a0aec0; margin-bottom: 4px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .card-meta {
      font-size: 10px; color: #718096;
      display: flex; gap: 10px; flex-wrap: wrap;
    }
    .card-meta span { display: flex; align-items: center; gap: 3px; }
    .clicks-hint {
      font-size: 10px; color: #7c83f7; margin-left: auto;
      opacity: 0.7;
    }
    /* ---------- Modal ---------- */
    #modal {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.75);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    #modal.open { display: flex; }
    .modal-box {
      background: #1e2235;
      border-radius: 12px;
      border: 1px solid #4a5568;
      padding: 24px;
      max-width: 600px; width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }
    .modal-box h3 { font-size: 15px; margin-bottom: 12px; color: #7c83f7; }
    .snippet-text {
      font-family: monospace;
      font-size: 12px;
      background: #0f1117;
      border-radius: 6px;
      padding: 10px 14px;
      color: #e2e8f0;
      white-space: pre-wrap;
      margin-bottom: 12px;
    }
    .modal-meta { font-size: 12px; color: #a0aec0; }
    .modal-meta span { display: block; margin-bottom: 4px; }
    .modal-close {
      margin-top: 14px;
      padding: 6px 18px;
      background: #2d3748;
      color: #e2e8f0;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    .modal-close:hover { background: #3d4a5e; }
    /* ---------- scrollbar ---------- */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #0f1117; }
    ::-webkit-scrollbar-thumb { background: #2d3748; border-radius: 3px; }
  </style>
</head>
<body>

<header>
  <h1>Контур — Gate K Protocol Viewer</h1>
  <span class="badge" id="overallBadge">LOADING…</span>
  <span class="badge" id="penaltyBadge"></span>
  <div class="pdf-upload">
    <label for="pdfInput">📄 Загрузить PDF</label>
    <input type="file" id="pdfInput" accept="application/pdf" style="display:none" />
  </div>
</header>

<main>
  <!-- LEFT: PDF viewer -->
  <div class="pdf-panel">
    <div class="pdf-toolbar">
      <button id="btnPrev">◀</button>
      <span id="pageInfo">- / -</span>
      <button id="btnNext">▶</button>
      <span style="margin-left:8px;color:#a0aec0;font-size:11px" id="scaleInfo">Масштаб: 1x</span>
    </div>
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="pdfCanvas"></canvas>
      <svg id="bboxSvg" width="0" height="0"></svg>
    </div>
  </div>

  <!-- RIGHT: Evidence Cards -->
  <div class="cards-panel">
    <div class="cards-header">
      <h2>Evidence Cards (132 параметра)</h2>
      <div class="filter-row" id="filterRow">
        <button class="filter-btn active" data-sev="ALL">Все</button>
        <button class="filter-btn" data-sev="BLOCKER">BLOCKER</button>
        <button class="filter-btn" data-sev="CRITICAL">CRITICAL</button>
        <button class="filter-btn" data-sev="MAJOR">MAJOR</button>
        <button class="filter-btn" data-sev="MINOR">MINOR</button>
      </div>
    </div>
    <div class="cards-list" id="cardsList"></div>
  </div>
</main>

<!-- Modal: OCR snippet -->
<div id="modal">
  <div class="modal-box">
    <h3 id="modalTitle">OCR сниппет</h3>
    <div class="snippet-text" id="modalSnippet"></div>
    <div class="modal-meta" id="modalMeta"></div>
    <button class="modal-close" id="modalClose">× Закрыть</button>
  </div>
</div>

<script>
// ============================================================
// Gate K — 3-click protocol (HCAI DSS Review 2026)
// Click 1: select card in right panel
// Click 2: jump PDF to page + draw bbox
// Click 3: open OCR snippet modal
// ============================================================

// --- Demo EvidenceCards (4 representative entries) ---
const DEMO_CARDS = [
  {
    rule_code: 'PZ-001', severity: 'BLOCKER',
    status: 'COMPLIANT',
    rule_description: 'Печать организации и подпись ГИП',
    extracted_value: 'ООО «ДезинСтрой»', expected_value: 'ООО «ДезинСтрой»',
    clicks_to_navigate: 1, penalty: 0,
    norm_ref: 'ГОСТ Р 21.101-2026 §4.3',
    snippets: [{
      text: 'ООО «ДезинСтрой»',
      confidence: 0.97, character_accuracy: 0.99,
      ocr_path: 'VECTOR_PDFIUM',
      bbox: { page: 1, x0: 0.05, y0: 0.88, x1: 0.45, y1: 0.95 }
    }]
  },
  {
    rule_code: 'PZ-003', severity: 'CRITICAL',
    status: 'CONFIRMED_VIOLATION',
    rule_description: 'Масштаб чертежа',
    extracted_value: '1:500', expected_value: '1:200',
    clicks_to_navigate: 2, penalty: 7.0,
    norm_ref: 'ГОСТ Р 21.101-2026 §4.5',
    snippets: [{
      text: 'М-б 1:500',
      confidence: 0.91, character_accuracy: 0.98,
      ocr_path: 'VECTOR_PDFIUM',
      bbox: { page: 2, x0: 0.65, y0: 0.92, x1: 0.95, y1: 0.97 }
    }]
  },
  {
    rule_code: 'PZ-002', severity: 'CRITICAL',
    status: 'COMPLIANT',
    rule_description: 'Общая площадь',
    extracted_value: '487.6', expected_value: '487.6',
    clicks_to_navigate: 2, penalty: 0,
    norm_ref: 'ПП РФ №87 §3.1',
    snippets: [{
      text: 'Sобщ = 487.6 м²',
      confidence: 0.94, character_accuracy: 0.97,
      ocr_path: 'RASTER_REGION',
      bbox: { page: 3, x0: 0.10, y0: 0.40, x1: 0.50, y1: 0.46 }
    }]
  },
  {
    rule_code: 'SPZU-024', severity: 'MAJOR',
    status: 'ABSTAINED',
    rule_description: 'Объем грунта выемки',
    extracted_value: null, expected_value: null,
    clicks_to_navigate: 3, penalty: 0,
    norm_ref: 'Приказ Минстроя №369/пр',
    snippets: [{
      text: '[Блок оцифрован недостаточно: CA=0.89 < 0.97]',
      confidence: 0.72, character_accuracy: 0.89,
      ocr_path: 'RASTER_REGION',
      bbox: { page: 5, x0: 0.08, y0: 0.55, x1: 0.90, y1: 0.62 }
    }]
  }
];

// --- State ---
let cards = DEMO_CARDS;
let activeIdx = -1;
let clickCount = []; // per card: 0=none, 1=selected, 2=pdf+bbox, 3=modal
let pdfDoc = null;
let currentPage = 1;
let pdfScale = 1.5;

// --- PDF.js lazy load (v4.4.168) ---
async function loadPdfJs() {
  if (window.pdfjsLib) return window.pdfjsLib;
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs';
    s.type = 'module';
    s.onload = () => {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';
      resolve(window.pdfjsLib);
    };
    s.onerror = reject;
    document.head.appendChild(s);
  });
}

// --- Render PDF page ---
async function renderPdfPage(pageNum) {
  if (!pdfDoc) return drawPlaceholderCanvas();
  try {
    const page = await pdfDoc.getPage(pageNum);
    const viewport = page.getViewport({ scale: pdfScale });
    const canvas = document.getElementById('pdfCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width  = viewport.width;
    canvas.height = viewport.height;
    const svg = document.getElementById('bboxSvg');
    svg.setAttribute('width',  viewport.width);
    svg.setAttribute('height', viewport.height);
    svg.innerHTML = '';
    await page.render({ canvasContext: ctx, viewport }).promise;
    currentPage = pageNum;
    document.getElementById('pageInfo').textContent =
      `${pageNum} / ${pdfDoc.numPages}`;
    document.getElementById('scaleInfo').textContent =
      `Масштаб: ${pdfScale}x`;
  } catch (e) {
    console.error('renderPdfPage:', e);
  }
}

// --- Jump to page (click 2) ---
async function jumpToPdfPage(pageNum) {
  if (!pdfDoc) {
    drawPlaceholderCanvas();
    return;
  }
  if (pageNum !== currentPage) {
    await renderPdfPage(pageNum);
  }
}

// --- Draw BoundingBox overlay ---
function drawBbox(bbox) {
  const canvas = document.getElementById('pdfCanvas');
  const svg    = document.getElementById('bboxSvg');
  const W = canvas.width;
  const H = canvas.height;
  svg.setAttribute('width',  W);
  svg.setAttribute('height', H);
  svg.innerHTML = '';

  const x = bbox.x0 * W;
  const y = bbox.y0 * H;
  const w = (bbox.x1 - bbox.x0) * W;
  const h = (bbox.y1 - bbox.y0) * H; // Red Team fix: was (bbox.y1-bbox.y0)*H

  const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
  rect.setAttribute('x', x);
  rect.setAttribute('y', y);
  rect.setAttribute('width',  w);
  rect.setAttribute('height', h);
  rect.setAttribute('fill',   'rgba(124,131,247,0.15)');
  rect.setAttribute('stroke', '#7c83f7');
  rect.setAttribute('stroke-width', '2');
  rect.setAttribute('rx', '3');
  svg.appendChild(rect);
}

// --- Open snippet modal (click 3) ---
function openSnippetModal(idx) {
  const card = cards[idx];
  const snip = card.snippets && card.snippets[0];
  document.getElementById('modalTitle').textContent =
    `${card.rule_code} — OCR сниппет`;
  document.getElementById('modalSnippet').textContent =
    snip ? snip.text : '[Сниппетов нет]';
  document.getElementById('modalMeta').innerHTML = snip ? `
    <span>📊 CA: <b>${(snip.character_accuracy*100).toFixed(1)}%</b></span>
    <span>🎯 Conf: <b>${(snip.confidence*100).toFixed(1)}%</b></span>
    <span>📦 OCR: <b>${snip.ocr_path}</b></span>
    <span>📄 Стр.: <b>${snip.bbox.page}</b></span>
    <span>🗒 Норм: <b>${card.norm_ref || '—'}</b></span>
  ` : '';
  document.getElementById('modal').classList.add('open');
}

// --- Card click handler (3-click protocol) ---
async function handleCardClick(idx) {
  const card = cards[idx];
  const snip = card.snippets && card.snippets[0];

  if (activeIdx !== idx) {
    // Click 1: select card
    activeIdx = idx;
    clickCount[idx] = 1;
    renderCardList();
    return;
  }

  // Already selected → click 2 or 3
  const count = (clickCount[idx] || 1) + 1;
  clickCount[idx] = count;

  if (count === 2 && snip) {
    // Click 2: jump PDF + draw bbox
    await jumpToPdfPage(snip.bbox.page);
    drawBbox(snip.bbox);
  } else {
    // Click 3: open modal
    if (count >= 3) clickCount[idx] = 1; // reset for next cycle
    openSnippetModal(idx);
  }
}

// --- Placeholder canvas (no PDF loaded) ---
function drawPlaceholderCanvas() {
  const canvas = document.getElementById('pdfCanvas');
  canvas.width  = 595;
  canvas.height = 842;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#f0f0f0';
  ctx.fillRect(0, 0, 595, 842);
  ctx.fillStyle = '#999';
  ctx.font = '20px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Загрузите PDF через кнопку вверху', 297, 400);
  ctx.fillText('(или просмотрите demo данные)', 297, 430);
  const svg = document.getElementById('bboxSvg');
  svg.setAttribute('width',  '595');
  svg.setAttribute('height', '842');
  svg.innerHTML = '';
  document.getElementById('pageInfo').textContent = '- / -';
}

// --- Filter state ---
let activeFilter = 'ALL';

// --- Render card list ---
function renderCardList() {
  const list = document.getElementById('cardsList');
  const filtered = cards.filter(c =>
    activeFilter === 'ALL' || c.severity === activeFilter
  );
  if (filtered.length === 0) {
    list.innerHTML = '<div style="color:#718096;font-size:12px;padding:20px;text-align:center">Нет карточек</div>';
    return;
  }
  list.innerHTML = filtered.map((card, fi) => {
    const realIdx = cards.indexOf(card);
    const clicks = card.clicks_to_navigate;
    const dots = '🔵'.repeat(clicks) + '⚪'.repeat(3 - clicks);
    return `<div class="card${realIdx === activeIdx ? ' active' : ''}"
        onclick="handleCardClick(${realIdx})">
      <div class="card-top">
        <span class="rule-code">${card.rule_code}</span>
        <span class="sev-badge sev-${card.severity}">${card.severity}</span>
        <span class="status-badge status-${card.status}">
          ${{ CONFIRMED_VIOLATION: '✖ НАРУШЕНИЕ', ABSTAINED: '⚠ ABSTAIN', COMPLIANT: '✔ ОК' }[card.status]}
        </span>
      </div>
      <div class="card-desc">${card.rule_description || card.rule_code}</div>
      <div class="card-meta">
        ${card.extracted_value != null
          ? `<span>📌 ${card.extracted_value}</span>` : ''}
        ${card.penalty > 0
          ? `<span style="color:#fc8181">⚠ -${card.penalty}pt</span>` : ''}
        ${card.norm_ref ? `<span>${card.norm_ref}</span>` : ''}
        <span class="clicks-hint">${dots} ${clicks}/3</span>
      </div>
    </div>`;
  }).join('');
}

// --- Update header badges ---
function updateBadges() {
  const penalty  = cards.reduce((s,c) => s + (c.penalty||0), 0);
  const hasBlock = cards.some(c => c.status === 'CONFIRMED_VIOLATION' && c.severity === 'BLOCKER');
  const badge    = document.getElementById('overallBadge');
  badge.textContent = hasBlock ? '✖ FAILED (BLOCKER)' : penalty > 0 ? '⚠ VIOLATIONS' : '✔ PASSED';
  badge.className   = 'badge ' + (hasBlock ? 'failed' : penalty > 0 ? '' : 'passed');
  const pb = document.getElementById('penaltyBadge');
  pb.textContent = `штраф: -${penalty}pt`;
  pb.style.display = penalty > 0 ? '' : 'none';
}

// --- PDF upload (Red Team fix: file.arrayBuffer() instead of URL-meatObjectURL) ---
document.getElementById('pdfInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const pdfjsLib = await loadPdfJs();
    const arrayBuffer = await file.arrayBuffer(); // Red Team fix
    pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    await renderPdfPage(1);
  } catch (err) {
    console.error('PDF load error:', err);
    alert('Ошибка загрузки PDF: ' + err.message);
  }
});

// --- Toolbar navigation ---
document.getElementById('btnPrev').addEventListener('click', () => {
  if (pdfDoc && currentPage > 1) renderPdfPage(currentPage - 1);
});
document.getElementById('btnNext').addEventListener('click', () => {
  if (pdfDoc && currentPage < pdfDoc.numPages) renderPdfPage(currentPage + 1);
});

// --- Filter buttons ---
document.getElementById('filterRow').addEventListener('click', (e) => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  activeFilter = btn.dataset.sev;
  document.querySelectorAll('.filter-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.sev === activeFilter)
  );
  renderCardList();
});

// --- Modal close ---
document.getElementById('modalClose').addEventListener('click', () =>
  document.getElementById('modal').classList.remove('open'));
document.getElementById('modal').addEventListener('click', (e) => {
  if (e.target === document.getElementById('modal'))
    document.getElementById('modal').classList.remove('open');
});

// --- Init ---
clickCount = cards.map(() => 0);
updateBadges();
renderCardList();
drawPlaceholderCanvas();
</script>
</body>
</html>
