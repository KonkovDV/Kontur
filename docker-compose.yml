# docker-compose.yml — локальная разработка и CI (ТЗ п.1.5, п.9.1).
# Для offline-запуска: docker compose -f docker-compose.yml -f docker-compose.offline.yml up -d
# Для pre-pull образов:  make offline-pull

services:

  # ── инфраструктура ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kontur
      POSTGRES_USER: kontur
      POSTGRES_PASSWORD: kontur
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/kontur/infrastructure/db/schema.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kontur -d kontur"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Кеш парсинга по хешу файла (ТЗ п.9.1, шаг 5). Не durable queue.
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 5s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    # Очередь по ТЗ п.1.5. Доставка at-least-once, идемпотентность — на стороне ядра.
    ports:
      - "5672:5672"
      - "15672:15672"    # management UI: http://localhost:15672 guest/guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  minio:
    # Pinned release — не обновляется автоматически (production best practice).
    # Обновить через: docker pull minio/minio:RELEASE.2024-09-13T20-26-02Z
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kontur
      MINIO_ROOT_PASSWORD: kontur-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"    # console UI: http://localhost:9001
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ── приложение ──────────────────────────────────────────────────────────────

  core:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: uvicorn kontur.presentation.api:app --host 0.0.0.0 --port 8000
    environment:
      KONTUR_DB_URL: postgresql://kontur:kontur@postgres:5432/kontur
      KONTUR_REDIS_URL: redis://redis:6379/0
      KONTUR_AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      KONTUR_OBJECT_STORE_URL: http://minio:9000
      # Лимиты загрузки (ТЗ п.9.1)
      KONTUR_MAX_FILE_BYTES: "52428800"   # 50 МБ
      KONTUR_MAX_BATCH_BYTES: "209715200" # 200 МБ
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  gateway:
    build:
      context: ./gateway
    restart: unless-stopped
    environment:
      KONTUR_CORE_URL: http://core:8000
    depends_on:
      core:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  pgdata:
    driver: local
  minio:
    driver: local
