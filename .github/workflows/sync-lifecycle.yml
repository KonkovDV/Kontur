name: sync-lifecycle-db

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sync-lifecycle-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kontur
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e "backend[store]"
      - name: Apply source-of-truth schema
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d kontur -v ON_ERROR_STOP=1 \
            -f backend/src/kontur/infrastructure/db/schema.sql
      - name: Prove retry exhaustion and manual recovery
        env:
          KONTUR_DB_URL: postgresql://postgres:postgres@localhost:5432/kontur
        run: python scripts/check_sync_lifecycle.py
      - name: Prove storage integrity job on Postgres (list_all_files, audit, fail-closed)
        env:
          KONTUR_DB_URL: postgresql://postgres:postgres@localhost:5432/kontur
        run: python scripts/check_integrity_pg_live.py
