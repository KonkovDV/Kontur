name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "backend[dev]"
      - run: ruff check backend scripts
      - run: mypy --strict backend/src
      - run: pytest backend/tests -q

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "backend[dev]"
      - name: Схемы и OpenAPI разбираются
        run: python scripts/check_contracts.py

  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kontur
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Схема разворачивается, ограничения срабатывают
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5432 -U postgres -d kontur -v ON_ERROR_STOP=1 \
            -f backend/src/kontur/infrastructure/db/schema.sql \
            -f backend/src/kontur/infrastructure/db/checks.sql

  claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Честность публичных формулировок
        run: python scripts/check_claims.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Установить зависимости
        run: npm install
      - name: Проверка типов TypeScript
        run: npx tsc --noEmit

  containers:
    runs-on: ubuntu-latest
    env:
      KONTUR_JWT_ISSUER: https://issuer.example.invalid/
      KONTUR_JWT_AUDIENCE: kontur-api
      KONTUR_JWT_ALGORITHM: RS256
      KONTUR_JWT_PUBLIC_KEY: unused-for-health-check
      KONTUR_ALLOW_INSECURE_DEV_AUTH: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Validate base and offline compose contracts
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.offline.yml config --quiet
      - name: Build application images
        run: docker compose build core gateway
      - name: Verify fixed identity, read-only code, imports, and writable tmpfs
        run: |
          docker compose run --rm --no-deps --entrypoint sh core -ec '
            test "$(id -u)" = 10001
            test "$(id -g)" = 10001
            ! touch /app/.runtime-write-test
            touch /tmp/runtime-write-test
            python -c "import kontur.infrastructure.pdf_guard; import kontur.infrastructure.ocr_tesseract"
          '
          docker compose run --rm --no-deps --entrypoint sh gateway -ec '
            test "$(id -u)" = 10001
            test "$(id -g)" = 10001
            ! touch /app/.runtime-write-test
            touch /tmp/runtime-write-test
            node -e "import(\"./src/server.js\").then(() => process.exit(0))"
          '
      - name: Smoke health endpoints
        run: |
          docker compose up -d core gateway
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:8000/api/v1/healthz >/dev/null && break
            test "$attempt" -lt 60
            sleep 2
          done
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:3000/healthz >/dev/null && break
            test "$attempt" -lt 60
            sleep 2
          done
      - name: Cleanup containers
        if: always()
        run: docker compose down -v --remove-orphans
