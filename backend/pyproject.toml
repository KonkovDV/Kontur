[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kontur"
version = "0.1.0"
description = "Контур — Инспектор ИИ: сверка ПД/РД/ИД по матрице 132 параметров"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pypdfium2>=4.30",
    "pdfminer.six>=20240706",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
    "python-multipart>=0.0.12",
    "PyJWT[crypto]>=2.9,<3",
    "Pillow>=10",
    "python-docx>=1.1",
    "lxml>=5.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7", "mypy>=1.13", "hypothesis>=6.112", "httpx>=0.27"]
queue = ["aio-pika>=9.4"]
store = ["psycopg[binary]>=3.2", "redis>=5.1", "boto3>=1.35"]
ocr = ["rapidocr-onnxruntime>=1.3", "pytesseract>=0.3.10", "Pillow>=10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/test_gate_h_e2e.py" = ["E501"]
"tests/test_pz_enum_e2e.py" = ["E501"]
"tests/test_comparators.py" = ["E501"]
"tests/test_normative_db.py" = ["E501"]
"tests/test_contest_slice_e2e.py" = ["E501"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
