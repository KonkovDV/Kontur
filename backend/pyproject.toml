[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kontur"
version = "0.1.0"
description = "Контур — Инспектор ИИ: сверка ПД/РД/ИД по матрице 132 параметров"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pypdfium2>=4.30",
    "pdfminer.six>=20240706",
    "jsonschema>=4.23",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7", "mypy>=1.13", "hypothesis>=6.112"]
queue = ["aio-pika>=9.4"]
store = ["psycopg[binary]>=3.2", "redis>=5.1", "boto3>=1.35"]
ocr = ["rapidocr-onnxruntime>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
